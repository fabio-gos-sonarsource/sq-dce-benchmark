# Copy this to bench.yaml and fill in your two SonarQube instances (admin token each).
# Then run:  double-click run.command (macOS) / run.bat (Windows)  —  or:  ./sq-benchmark
# bench.yaml is git-ignored (it holds tokens).

targets:
  - name: EE
    url:   https://sonarqube-ee.example.com
    token: squ_xxxxxxxxxxxxxxxxxxxxxxxx
  - name: DCE
    url:   https://sonarqube-dce.example.com
    token: squ_yyyyyyyyyyyyyyyyyyyyyyyy

# --- optional (defaults shown; uncomment to change) --------------------------
# sample: python          # bundled seed to replay: python (~32k ncloc) | java (~34k)
# n: 40                   # analyses fired per target (burst size)
# concurrency: 12         # parallel submissions during the burst
# report: sq-ee-dce-benchmark.pdf

# Benchmark YOUR OWN repo instead of a bundled sample.
# (Only this mode needs a scanner: SonarScanner CLI, or JDK + Maven/Gradle for Java.
#  .NET is not supported.)
# seed_repo: /path/to/your/repo
# scan_mode: auto         # auto | maven | gradle | cli
# java_home: /path/to/jdk17   # if the project needs a specific JDK
# build_args: "-P profile"    # extra mvn/gradle args (build profile / module selection)

# Sustained load instead of a one-shot burst: submit at a steady rate for a while.
# This is the regime where a single EE node saturates (queue grows) while a bigger DCE
# cluster keeps up (queue stays flat). Use a light (PR-sized) seed and adequate hardware.
# load:
#   rate_per_min: 300     # analyses submitted per minute
#   duration_sec: 300     # for how long

# Add a production-model projection (capacity + feedback-delay chart + a plain
# "does one EE node keep up at your peak?" verdict) to the report:
# model:
#   devs: 5000
#   analyses_per_dev_day: 15
#   peak_fraction: 0.25
#   # Optional PR/branch mix — real traffic is mostly cheap PR analyses (changeset-sized)
#   # plus some full branch analyses. Give both CE times to model a realistic blend
#   # instead of the single measured value:
#   # pr_fraction: 0.9        # share that are PRs
#   # pr_ce_seconds: 0.5      # CE time for a typical PR analysis
#   # branch_ce_seconds: 8    # CE time for a full/branch analysis
