# Copy this to bench.yaml and fill in your two SonarQube instances (admin token each).
# Then run:  double-click run.command (macOS) / run.bat (Windows)  —  or:  ./sq-benchmark
# bench.yaml is git-ignored (it holds tokens).

targets:
  - name: EE
    url:   https://sonarqube-ee.example.com
    token: squ_xxxxxxxxxxxxxxxxxxxxxxxx
  - name: DCE
    url:   https://sonarqube-dce.example.com
    token: squ_yyyyyyyyyyyyyyyyyyyyyyyy

# Your developer count — the main knob. It sets the production-model peak in the report
# AND the rate of the default sustained load (peak = devs x analyses/day x peak%).
devs: 5000

# --- optional (defaults shown; uncomment to change) --------------------------
# sample: mixed           # bundled seed: mixed (80% PR + 20% full) | js (React) | java (jackson-databind)
# report: sq-ee-dce-benchmark.pdf
# concurrency: 12         # parallel submissions

# Load: by default a SUSTAINED load at your modelled peak (from devs above) for 60s.
# Leave this section commented to use the default. To change it:
# mode: burst             # switch to a one-shot burst of `n` analyses
# n: 40                   # burst size (only used with mode: burst)
# load:                   # override the sustained rate/duration (advanced)
#   rate_per_min: 300
#   duration_sec: 60

# Benchmark YOUR OWN repo instead of a bundled sample.
# (Only this mode needs a scanner: SonarScanner CLI, or JDK + Maven/Gradle for Java. .NET unsupported.)
# seed_repo: /path/to/your/repo
# scan_mode: auto         # auto | maven | gradle | cli
# java_home: /path/to/jdk17   # if the project needs a specific JDK
# build_args: "-P profile"    # extra mvn/gradle args (build profile / module selection)
# pr_mix: true            # also replay an auto-picked PR-sized slice (80% PR + 20% full);
#                         # falls back to full-scan-only if a slice can't be produced

# Fine-tune the production model (optional; devs above is usually enough):
# analyses_per_dev_day: 15   # default 15
# peak_fraction: 0.25        # share of the day's analyses in the busiest hour (default 0.25)
# model:                     # advanced: blend PR + branch CE times instead of the measured value
#   pr_fraction: 0.8         # share that are PRs (also sets the mixed-seed split)
#   pr_ce_seconds: 0.5
#   branch_ce_seconds: 8
