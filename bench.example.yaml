# Copy to bench.yaml and fill in.  bench.yaml is git-ignored (it holds tokens).
#
# One machine runs this. The heavy scan happens ONCE per target; the burst is
# then N cheap re-submissions, so the Compute Engine — not the scanner — is the
# bottleneck being measured.

seed_repo: ./sample-project        # repo scanned ONCE per target. Use a REPRESENTATIVE
                                   # repo for realistic CE task sizes (the bundled sample
                                   # is tiny — fine only for a smoke test).
n: 40                              # burst size: analyses fired at once
concurrency: 12                    # parallel submissions
scanner: sonar-scanner             # path to the SonarScanner CLI (must be on PATH or absolute)
namespace: bench                   # project-key prefix; every bench project uses it and is
                                   # deleted afterwards (set keep_projects: true to keep them)
report: ./sq-dce-benchmark-report.pdf
results_file: ./results.json       # metrics are saved here; independent runs accumulate

# Optional production model: extrapolates the measured CE time to a developer
# population and adds a "feedback delay vs load" chart + capacity table to the PDF.
# Uses the auto-detected workers/nodes per target. Omit this block to skip it.
model:
  devs: 5000                       # developer population to model
  analyses_per_dev_day: 8          # analyses each dev triggers/day (PRs, branches, CI)
  peak_fraction: 0.15              # share of daily analyses landing in the peak hour
  # ce_seconds: 5.0                # optional; default = measured CE time from this run
# keep_projects: false
# exclusions: "**/node_modules/**,**/dist/**,**/*.min.js"

targets:
  - name: EE
    url: https://sonarqube-ee.example.com
    token: squ_xxxxxxxxxxxxxxxxxxxxxxxx
  # workers: 6                    # OPTIONAL — auto-detected from the instance; set only to override the report label
  - name: DCE
    url: https://sonarqube-dce.example.com
    token: squ_yyyyyyyyyyyyyyyyyyyyyyyy
  # workers: 12                   # OPTIONAL — auto-detected
